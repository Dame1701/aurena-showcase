<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
          rel="stylesheet">
    <title>Aurena — Skins</title>
</head>
<body>
<div class="page">

    <!-- ============ AURORA BACKGROUND ============ -->
    <div class="aurora" aria-hidden="true">
        <div class="aurora__blob aurora__blob--1"></div>
        <div class="aurora__blob aurora__blob--2"></div>
        <div class="aurora__blob aurora__blob--3"></div>
        <div class="aurora__blob aurora__blob--4"></div>
    </div>

    <!-- ============ NAV ============ -->
    <nav class="nav">
        <a href="index.html" class="nav__brand">
            <img src="img/icon.png" alt="Aurena" class="brand-icon">
            <span class="brand-name">Aurena</span>
        </a>
        <div class="nav__links">
            <a href="index.html" class="nav__link">← Back to showcase</a>
            <a href="index.html#download" class="btn btn--primary btn--sm">Download Aurena</a>
        </div>
    </nav>

    <!-- ============ HEADER ============ -->
    <header class="section skins-head">
        <div class="container container--narrow">
            <div class="center-head">
                <div class="eyebrow">// Make it yours</div>
                <h1 class="heading-lg heading-lg--flush">Skin Gallery</h1>
                <p class="copy dl-intro">Browse community and official skins for Aurena. Download a
                    <code class="skins-code">.skin</code> file, then import it from Aurena's appearance settings.</p>
            </div>
        </div>
    </header>

    <!-- ============ GALLERY ============ -->
    <section class="section skins-section">
        <div class="container">
            <div id="skin-grid" class="skin-grid" aria-live="polite">
                <p id="skin-status" class="skins-status">Loading skins…</p>
            </div>
        </div>
    </section>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
        <div class="footer__inner">
            <div class="footer__brand">
                <img src="img/icon.png" alt="Aurena" class="brand-icon">
                <span class="brand-name">Aurena</span>
                <span class="footer__tag">Own your music. Play it anywhere.</span>
            </div>
            <div class="footer__links">
                <a href="index.html">Showcase</a>
                <a href="index.html#download">Download</a>
                <a href="skins.html">Skins</a>
                <a href="https://github.com/Dame1701/aurena-showcase" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </div>
    </footer>

</div>

<!-- ============ LIGHTBOX ============ -->
<div id="lightbox" class="lightbox skins-lightbox" hidden>
    <button id="lb-close" class="lightbox__close" aria-label="Close">✕</button>
    <button id="lb-prev" class="lightbox__nav lightbox__nav--prev" aria-label="Previous">‹</button>
    <button id="lb-next" class="lightbox__nav lightbox__nav--next" aria-label="Next">›</button>
    <figure class="lightbox__figure">
        <img id="lb-img" class="skins-lightbox__img" src="" alt="">
        <figcaption id="lb-caption" class="lightbox__caption"></figcaption>
    </figure>
</div>

<script src="scripts/skins.js"></script>
</body>
</html>
